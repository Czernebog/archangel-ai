services:
  - type: web
    name: archangel-ai-czernebog
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /healthz
    envVars:
      - key: ARCHANGEL_PUBLIC
        value: "1"
      - key: ARCHANGEL_SITE_PASSWORD
        sync: false
      - key: BRAVE_SEARCH_API_KEY
        sync: false